<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MemorizAR - Keikruk</title>

    <!-- Compatibilidad PWA e iOS (Safari WebKit) -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0b1b2b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MemorizAR">
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
    <link rel="apple-touch-icon" href="./icon-192.png">

    <!-- Librerías de Realidad Aumentada -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <!-- Parche para cámara en iOS / Safari -->
    <script>
      const observer = new MutationObserver((mutations) => {
        mutations.forEach((mutation) => {
          mutation.addedNodes.forEach((node) => {
            if (node.tagName === 'VIDEO') {
              node.setAttribute('playsinline', '');
              node.setAttribute('webkit-playsinline', '');
              node.setAttribute('autoplay', '');
              node.setAttribute('muted', '');
            }
          });
        });
      });
      observer.observe(document.documentElement, { childList: true, subtree: true });
    </script>

    <style>
      body { 
        margin: 0; 
        overflow: hidden; 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      /* Panel de información fijo en la pantalla */
      #info-card {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        width: 88%;
        max-width: 380px;
        background: rgba(11, 27, 43, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(8px);
        color: #ffffff;
        padding: 16px 20px;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
        z-index: 1000;
        display: none;
        box-sizing: border-box;
        pointer-events: none;
        transition: opacity 0.25s ease;
      }

      #info-card h3 {
        margin: 0 0 6px 0;
        font-size: 1.15rem;
        letter-spacing: 0.5px;
        color: #64b5f6;
        text-transform: uppercase;
      }

      #info-card p {
        margin: 0;
        font-size: 0.95rem;
        line-height: 1.4;
        color: #e0e0e0;
      }
    </style>
  </head>
  <body>

    <!-- Tarjeta informativa superpuesta -->
    <div id="info-card">
      <h3 id="card-title">Especie</h3>
      <p id="card-desc">Descripción de la biodiversidad.</p>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 2; filterMinCF: 0.0001; filterBeta: 0.001;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <!-- CARGA DE MODELOS 3D -->
      <a-assets>
        <a-asset-item id="mod-guanaco" src="./guanaco.glb"></a-asset-item>
        <a-asset-item id="mod-nirre" src="./nirre.glb"></a-asset-item>
        <a-asset-item id="mod-zapatito" src="./zapatito.glb"></a-asset-item>
        <a-asset-item id="mod-lupino" src="./lupino.glb"></a-asset-item>
        <a-asset-item id="mod-canelo" src="./canelo.glb"></a-asset-item>
        <a-asset-item id="mod-chilco" src="./chilco.glb"></a-asset-item>
        <a-asset-item id="mod-calafate" src="./calafate.glb"></a-asset-item>
        <a-asset-item id="mod-armadillo" src="./armadillo.glb"></a-asset-item>
        <a-asset-item id="mod-lobo" src="./lobo_marino.glb"></a-asset-item>
        <a-asset-item id="mod-carpintero" src="./carpintero.glb"></a-asset-item>
        <a-asset-item id="mod-chingue" src="./chingue.glb"></a-asset-item>
        <a-asset-item id="mod-zorro" src="./zorro.glb"></a-asset-item>
        <a-asset-item id="mod-condor" src="./condor.glb"></a-asset-item>
        <a-asset-item id="mod-ballena" src="./ballena.glb"></a-asset-item>
        <a-asset-item id="mod-puma" src="./puma.glb"></a-asset-item>
        <a-asset-item id="mod-pinguino" src="./pinguino.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- 0: GUANACO -->
      <a-entity mindar-image-target="targetIndex: 0" data-species="0">
        <a-gltf-model src="#mod-guanaco" position="0 0 0" scale="6.1 6.1 6.1" rotation="90 0 0"></a-gltf-model>
      </a-entity>

      <!-- 1: NIRRE (Vegetación) -->
      <a-entity mindar-image-target="targetIndex: 1" data-species="1">
        <a-gltf-model src="#mod-nirre" position="0 0 0" scale="7 7 7" rotation="90 0 0"></a-gltf-model>
      </a-entity>

      <!-- 2: ZAPATITO DE LA VIRGEN (Vegetación) -->
      <a-entity mindar-image-target="targetIndex: 2" data-species="2">
        <a-gltf-model src="#mod-zapatito" position="0 0 0" scale="7 7 7" rotation="90 0 0"></a-gltf-model>
      </a-entity>

      <!-- 3: LUPINO (Vegetación) -->
      <a-entity mindar-image-target="targetIndex: 3" data-species="3">
        <a-gltf-model src="#mod-lupino" position="0 0 0" scale="7 7 7" rotation="90 0 0"></a-gltf-model>
      </a-entity>

      <!-- 4: CANELO (Vegetación) -->
      <a-entity mindar-image-target="targetIndex: 4" data-species="4">
        <a-gltf-model src="#mod-canelo" position="0 0 0" scale="7 7 7" rotation="90 0 0"></a-gltf-model>
      </a-entity>

      <!-- 5: CHILCO (Vegetación) -->
      <a-entity mindar-image-target="targetIndex: 5" data-species="5">
        <a-gltf-model src="#mod-chilco" position="0 0 0" scale="7 7 7" rotation="90 0 0"></a-gltf-model>
      </a-entity>

      <!-- 6: CALAFATE (Vegetación) -->
      <a-entity mindar-image-target="targetIndex: 6" data-species="6">
        <a-gltf-model src="#mod-calafate" position="0 0 0" scale="7 7 7" rotation="90 0 0"></a-gltf-model>
      </a-entity>

      <!-- 7: ARMADILLO (Escala ajustada a 4.5) -->
      <a-entity mindar-image-target="targetIndex: 7" data-species="7">
        <a-gltf-model src="#mod-armadillo" position="0 0 0" scale="4.5 4.5 4.5" rotation="90 0 0"></a-gltf-model>
      </a-entity>

      <!-- 8: LOBO MARINO -->
      <a-entity mindar-image-target="targetIndex: 8" data-species="8">
        <a-gltf-model src="#mod-lobo" position="0 0 0" scale="6.1 6.1 6.1" rotation="90 0 0"></a-gltf-model>
      </a-entity>

      <!-- 9: CARPINTERO NEGRO -->
      <a-entity mindar-image-target="targetIndex: 9" data-species="9">
        <a-gltf-model src="#mod-carpintero" position="0 0 0" scale="6.1 6.1 6.1" rotation="90 0 0"></a-gltf-model>
      </a-entity>

      <!-- 10: CHINGUE -->
      <a-entity mindar-image-target="targetIndex: 10" data-species="10">
        <a-gltf-model src="#mod-chingue" position="0 0 0" scale="6.1 6.1 6.1" rotation="90 0 0"></a-gltf-model>
      </a-entity>

      <!-- 11: ZORRO -->
      <a-entity mindar-image-target="targetIndex: 11" data-species="11">
        <a-gltf-model src="#mod-zorro" position="0 0 0" scale="6.1 6.1 6.1" rotation="90 0 0"></a-gltf-model>
      </a-entity>

      <!-- 12: CONDOR -->
      <a-entity mindar-image-target="targetIndex: 12" data-species="12">
        <a-gltf-model src="#mod-condor" position="0 0 0" scale="6.1 6.1 6.1" rotation="90 0 0"></a-gltf-model>
      </a-entity>

      <!-- 13: BALLENA -->
      <a-entity mindar-image-target="targetIndex: 13" data-species="13">
        <a-gltf-model src="#mod-ballena" position="0 0 0" scale="6.1 6.1 6.1" rotation="90 0 0"></a-gltf-model>
      </a-entity>

      <!-- 14: PUMA -->
      <a-entity mindar-image-target="targetIndex: 14" data-species="14">
        <a-gltf-model src="#mod-puma" position="0 0 0" scale="6.1 6.1 6.1" rotation="90 0 0"></a-gltf-model>
      </a-entity>

      <!-- 15: PINGUINO -->
      <a-entity mindar-image-target="targetIndex: 15" data-species="15">
        <a-gltf-model src="#mod-pinguino" position="0 0 0" scale="6.1 6.1 6.1" rotation="90 0 0"></a-gltf-model>
      </a-entity>

    </a-scene>

    <!-- CONTROLADOR JAVASCRIPT DEL PANEL 2D -->
    <script>
      const speciesData = {
        0: { 
          title: "¿Sabías que...? Guanaco", 
          desc: "¡Sus pestañas largas no son de adorno! Las usan para proteger sus ojos del polvo y los fuertes vientos de la estepa patagónica. Además, pueden correr hasta a 60 km/h." 
        },
        1: { 
          title: "¿Sabías que...? Ñirre", 
          desc: "Es un verdadero sobreviviente del viento austral: en zonas muy expuestas no crece derecho, sino retorcido y pegado al suelo formando el famoso 'bosque enano'." 
        },
        2: { 
          title: "¿Sabías que...? Zapatito de la Virgen", 
          desc: "Su flor tiene una forma de 'globo' o zapatilla diseñada específicamente para que los abejorros queden atrapados unos segundos y salgan cubiertos de polen." 
        },
        3: { 
          title: "¿Sabías que...? Lupino", 
          desc: "Aunque hoy pinta de morado y azul los caminos de la Patagonia, en realidad no es nativo: llegó desde el hemisferio norte y coloniza muy rápido terrenos pobres en nutrientes." 
        },
        4: { 
          title: "¿Sabías que...? Canelo", 
          desc: "Es el árbol sagrado mapuche y yagán. Sus hojas y corteza tienen tanta vitamina C que los antiguos navegantes las mascaban para evitar la temida enfermedad del escorbuto." 
        },
        5: { 
          title: "¿Sabías que...? Chilco", 
          desc: "Sus flores colgantes son el manjar preferido del picaflor rubí. Además, ¡sus frutos morados y alargados son totalmente comestibles y muy dulces!" 
        },
        6: { 
          title: "¿Sabías que...? Calafate", 
          desc: "Dice la leyenda que 'quien come calafate, siempre regresa a la Patagonia'. Sus espinas nacen en grupos de a tres y sus frutos morados son potentes antioxidantes." 
        },
        7: { 
          title: "¿Sabías que...? Armadillo (Peludo)", 
          desc: "A diferencia de otros armadillos, este tiene pelo largo entre sus placas óseas para soportar el frío austral. ¡Puede excavar una madriguera completa en menos de 2 minutos!" 
        },
        8: { 
          title: "¿Sabías que...? Lobo Marino", 
          desc: "Pueden sumergirse a más de 100 metros de profundidad y aguantar la respiración bajo el mar helado por casi 15 minutos mientras persiguen peces y calamares." 
        },
        9: { 
          title: "¿Sabías que...? Carpintero Negro", 
          desc: "Su cráneo tiene un sistema de 'amortiguación' biológico único: golpea la madera hasta 20 veces por segundo sin sufrir dolores de cabeza ni daño cerebral." 
        },
        10: { 
          title: "¿Sabías que...? Chingue Patagónico", 
          desc: "Su spray oloroso defensivo es tan potente que puede alcanzar hasta 3 metros de distancia y causar ceguera temporal a depredadores como zorros y pumas." 
        },
        11: { 
          title: "¿Sabías que...? Zorro Culpeo", 
          desc: "Es el segundo carnívoro más grande de Magallanes tras el puma. Su cola gruesa y esponjosa no es solo equilibrio: le sirve de frazada para taparse la nariz al dormir." 
        },
        12: { 
          title: "¿Sabías que...? Cóndor Andino", 
          desc: "Con sus alas extendidas alcanza los 3 metros. Gracias a su planeo aprovecha las corrientes de aire caliente y puede volar cientos de kilómetros sin aletear casi nada." 
        },
        13: { 
          title: "¿Sabías que...? Ballena Franca Austral", 
          desc: "Cada ballena tiene marcas blancas y rugosas llamadas callosidades en su cabeza que son únicas, ¡iguales a una huella dactilar humana que permite identificarlas una a una!" 
        },
        14: { 
          title: "¿Sabías que...? Puma", 
          desc: "A pesar de su gran tamaño, no ruge como un león: ronronea, maúlla y silba como un gato doméstico gigante. Además, ¡puede saltar hasta 5 metros de alto!" 
        },
        15: { 
          title: "¿Sabías que...? Pingüino de Magallanes", 
          desc: "Beben agua salada de mar y expulsan el exceso de sal por una glándula especial ubicada detrás de sus ojos, simulando que estuvieran constantemente 'estornudando'." 
        }
      };

      const infoCard = document.getElementById('info-card');
      const cardTitle = document.getElementById('card-title');
      const cardDesc = document.getElementById('card-desc');
      const targets = document.querySelectorAll('[mindar-image-target]');

      targets.forEach(target => {
        target.addEventListener('targetFound', () => {
          const id = target.getAttribute('data-species');
          if (speciesData[id]) {
            cardTitle.innerText = speciesData[id].title;
            cardDesc.innerText = speciesData[id].desc;
            infoCard.style.display = 'block';
          }
        });

        target.addEventListener('targetLost', () => {
          infoCard.style.display = 'none';
        });
      });
    </script>

    <!-- REGISTRO DEL SERVICE WORKER (PWA) -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(() => console.log('PWA lista y archivos precargados en caché local'))
            .catch((err) => console.error('Error al registrar Service Worker:', err));
        });
      }
    </script>
  </body>
</html>
