<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MemorizAR - Keikruk</title>

    <!-- Compatibilidad PWA e iOS -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0b1b2b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MemorizAR">
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
    <link rel="apple-touch-icon" href="./icon-192.png">

    <!-- Librerías AR -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body { 
        margin: 0; 
        overflow: hidden; 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      #info-card {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        width: 88%;
        max-width: 380px;
        background: rgba(11, 27, 43, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(8px);
        color: #ffffff;
        padding: 16px 20px;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
        z-index: 1000;
        display: none;
        box-sizing: border-box;
        pointer-events: none;
        transition: opacity 0.25s ease;
      }

      #info-card h3 {
        margin: 0 0 6px 0;
        font-size: 1.15rem;
        letter-spacing: 0.5px;
        color: #64b5f6;
        text-transform: uppercase;
      }

      #info-card p {
        margin: 0;
        font-size: 0.95rem;
        line-height: 1.4;
        color: #e0e0e0;
      }
    </style>
  </head>
  <body>

    <div id="info-card">
      <h3 id="card-title">Especie</h3>
      <p id="card-desc">Descripción</p>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 2; filterMinCF: 0.0001; filterBeta: 0.001;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets timeout="10000">
        <a-asset-item id="mod-guanaco" src="./guanaco.glb"></a-asset-item>
        <a-asset-item id="mod-nirre" src="./nirre.glb"></a-asset-item>
        <a-asset-item id="mod-zapatito" src="./zapatito.glb"></a-asset-item>
        <a-asset-item id="mod-lupino" src="./lupino.glb"></a-asset-item>
        <a-asset-item id="mod-canelo" src="./canelo.glb"></a-asset-item>
        <a-asset-item id="mod-chilco" src="./chilco.glb"></a-asset-item>
        <a-asset-item id="mod-calafate" src="./calafate.glb"></a-asset-item>
        <a-asset-item id="mod-armadillo" src="./armadillo.glb"></a-asset-item>
        <a-asset-item id="mod-lobo" src="./lobo_marino.glb"></a-asset-item>
        <a-asset-item id="mod-carpintero" src="./carpintero.glb"></a-asset-item>
        <a-asset-item id="mod-chingue" src="./chingue.glb"></a-asset-item>
        <a-asset-item id="mod-zorro" src="./zorro.glb"></a-asset-item>
        <a-asset-item id="mod-condor" src="./condor.glb"></a-asset-item>
        <a-asset-item id="mod-ballena" src="./ballena.glb"></a-asset-item>
        <a-asset-item id="mod-puma" src="./puma.glb"></a-asset-item>
        <a-asset-item id="mod-pinguino" src="./pinguino.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- 0: GUANACO -->
      <a-entity mindar-image-target="targetIndex: 0" data-species="0">
        <a-gltf-model src="#mod-guanaco" position="0 0 0" scale="6.1 6.1 6.1" rotation="90 0 0"></a-gltf-model>
      </a-entity>

      <!-- 1: NIRRE -->
      <a-entity mindar-image-target="targetIndex: 1" data-species="1">
        <a-gltf-model src="#mod-nirre" position="0 0 0" scale="7 7 7" rotation="90 0 0"></a-gltf-model>
      </a-entity>

      <!-- 2: ZAPATITO DE LA VIRGEN -->
      <a-entity mindar-image-target="targetIndex: 2" data-species="2">
        <a-gltf-model src="#mod-zapatito" position="0 0 0" scale="7 7 7" rotation="90 0 0"></a-gltf-model>
      </a-entity>

      <!-- 3: LUPINO -->
      <a-entity mindar-image-target="targetIndex: 3" data-species="3">
        <a-gltf-model src="#mod-lupino" position="0 0 0" scale="7 7 7" rotation="90 0 0"></a-gltf-model>
      </a-entity>

      <!-- 4: CANELO -->
      <a-entity mindar-image-target="targetIndex: 4" data-species="4">
        <a-gltf-model src="#mod-canelo" position="0 0 0" scale="7 7 7" rotation="90 0 0"></a-gltf-model>
      </a-entity>

      <!-- 5: CHILCO -->
      <a-entity mindar-image-target="targetIndex: 5" data-species="5">
        <a-gltf-model src="#mod-chilco" position="0 0 0" scale="7 7 7" rotation="90 0 0"></a-gltf-model>
      </a-entity>

      <!-- 6: CALAFATE -->
      <a-entity mindar-image-target="targetIndex: 6" data-species="6">
        <a-gltf-model src="#mod-calafate" position="0 0 0" scale="7 7 7" rotation="90 0 0"></a-gltf-model>
      </a-entity>

      <!-- 7: ARMADILLO -->
      <a-entity mindar-image-target="targetIndex: 7" data-species="7">
        <a-gltf-model src="#mod-armadillo" position="0 0 0" scale="4.5 4.5 4.5" rotation="90 0 0"></a-gltf-model>
      </a-entity>

      <!-- 8: LOBO MARINO -->
      <a-entity mindar-image-target="targetIndex: 8" data-species="8">
        <a-gltf-model src="#mod-lobo" position="0 0 0" scale="6.1 6.1 6.1" rotation="90 0 0"></a-gltf-model>
      </a-entity>

      <!-- 9: CARPINTERO NEGRO -->
      <a-entity mindar-image-target="targetIndex: 9" data-species="9">
        <a-gltf-model src="#mod-carpintero" position="0 0 0" scale="6.1 6.1 6.1" rotation="90 0 0"></a-gltf-model>
      </a-entity>

      <!-- 10: CHINGUE -->
      <a-entity mindar-image-target="targetIndex: 10" data-species="10">
        <a-gltf-model src="#mod-chingue" position="0 0 0" scale="6.1 6.1 6.1" rotation="90 0 0"></a-gltf-model>
      </a-entity>

      <!-- 11: ZORRO -->
      <a-entity mindar-image-target="targetIndex: 11" data-species="11">
        <a-gltf-model src="#mod-zorro" position="0 0 0" scale="6.1 6.1 6.1" rotation="90 0 0"></a-gltf-model>
      </a-entity>

      <!-- 12: CONDOR -->
      <a-entity mindar-image-target="targetIndex: 12" data-species="12">
        <a-gltf-model src="#mod-condor" position="0 0 0" scale="6.1 6.1 6.1" rotation="90 0 0"></a-gltf-model>
      </a-entity>

      <!-- 13: BALLENA -->
      <a-entity mindar-image-target="targetIndex: 13" data-species="13">
        <a-gltf-model src="#mod-ballena" position="0 0 0" scale="6.1 6.1 6.1" rotation="90 0 0"></a-gltf-model>
      </a-entity>

      <!-- 14: PUMA -->
      <a-entity mindar-image-target="targetIndex: 14" data-species="14">
        <a-gltf-model src="#mod-puma" position="0 0 0" scale="6.1 6.1 6.1" rotation="90 0 0"></a-gltf-model>
      </a-entity>

      <!-- 15: PINGUINO -->
      <a-entity mindar-image-target="targetIndex: 15" data-species="15">
        <a-gltf-model src="#mod-pinguino" position="0 0 0" scale="6.1 6.1 6.1" rotation="90 0 0"></a-gltf-model>
      </a-entity>

    </a-scene>

    <script>
      // Compatibilidad de video para iOS Safari
      document.addEventListener("DOMContentLoaded", () => {
        const observer = new MutationObserver((mutations) => {
          mutations.forEach((mutation) => {
            mutation.addedNodes.forEach((node) => {
              if (node.tagName === 'VIDEO') {
                node.setAttribute('playsinline', '');
                node.setAttribute('webkit-playsinline', '');
                node.setAttribute('autoplay', '');
                node.setAttribute('muted', '');
              }
            });
          });
        });
        observer.observe(document.body, { childList: true, subtree: true });
      });

      // Datos curiosos
      const speciesData = {
        0: { title: "¿Sabías que...? Guanaco", desc: "Sus pestañas largas protegen sus ojos del polvo y fuertes vientos patagónicos. Además, corren hasta a 60 km/h." },
        1: { title: "¿Sabías que...? Ñirre", desc: "En zonas de viento extremo crece pegado al suelo y retorcido, formando el característico bosque enano." },
        2: { title: "¿Sabías que...? Zapatito de la Virgen", desc: "Su flor con forma de zapatilla atrapa abejorros unos segundos para asegurar que salgan cubiertos de polen." },
        3: { title: "¿Sabías que...? Lupino", desc: "Pinta de tonos azules los caminos patagónicos, pero es introducida: prospera con gran facilidad en suelos pobres." },
        4: { title: "¿Sabías que...? Canelo", desc: "Árbol sagrado mapuche y yagán. Sus hojas ricas en vitamina C eran mascadas por navegantes para prevenir el escorbuto." },
        5: { title: "¿Sabías que...? Chilco", desc: "Flor favorita del picaflor rubí. Sus frutos morados colgantes son nativos, dulces y completamente comestibles." },
        6: { title: "¿Sabías que...? Calafate", desc: "Dice la tradición que quien come su fruto siempre vuelve a la Patagonia. Posee espinas triples y gran poder antioxidante." },
        7: { title: "¿Sabías que...? Armadillo (Peludo)", desc: "Posee pelos largos entre sus placas óseas para aislarse del frío austral. Excava madrigueras en menos de 2 minutos." },
        8: { title: "¿Sabías que...? Lobo Marino", desc: "Se sumerge a más de 100 metros de profundidad y tolera hasta 15 minutos sin respirar en aguas heladas cazando peces." },
        9: { title: "¿Sabías que...? Carpintero Negro", desc: "Su cráneo tiene un sistema de amortiguación esponjoso: golpea la madera 20 veces por segundo sin daño cerebral." },
        10: { title: "¿Sabías que...? Chingue Patagónico", desc: "Su líquido defensivo alcanza 3 metros de distancia y produce ceguera temporal a cazadores como el zorro y el puma." },
        11: { title: "¿Sabías que...? Zorro Culpeo", desc: "El segundo mamífero carnívoro más grande de Magallanes tras el puma. Usa su densa cola como manta al dormir." },
        12: { title: "¿Sabías que...? Cóndor Andino", desc: "Llega a 3 metros de envergadura alar. Planea en corrientes de aire recorriendo grandes distancias casi sin aletear." },
        13: { title: "¿Sabías que...? Ballena Franca Austral", desc: "Las callosidades blancas en su cabeza son únicas en cada ejemplar, funcionando exactamente como una huella dactilar." },
        14: { title: "¿Sabías que...? Puma", desc: "No ruge: emite ronroneos y silbidos agudos. Es capaz de dar saltos verticales de hasta 5 metros sobre barrancos." },
        15: { title: "¿Sabías que...? Pingüino de Magallanes", desc: "Filtra el agua de mar gracias a una glándula detrás de sus ojos, expulsando la sal sobrante en pequeños estornudos." }
      };

      const infoCard = document.getElementById('info-card');
      const cardTitle = document.getElementById('card-title');
      const cardDesc = document.getElementById('card-desc');
      const targets = document.querySelectorAll('[mindar-image-target]');

      targets.forEach(target => {
        target.addEventListener('targetFound', () => {
          const id = target.getAttribute('data-species');
          if (speciesData[id]) {
            cardTitle.innerText = speciesData[id].title;
            cardDesc.innerText = speciesData[id].desc;
            infoCard.style.display = 'block';
          }
        });

        target.addEventListener('targetLost', () => {
          infoCard.style.display = 'none';
        });
      });

      // Registro Service Worker PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .catch((err) => console.error('SW Error:', err));
        });
      }
    </script>
  </body>
</html>
